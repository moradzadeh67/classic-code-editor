rvice</text><rect x="60" y="620" width="560" height="240" rx="16" fill="#ffffff" stroke="#d9dceb" stroke-width="2"/><text x="88" y="662" font-family="'Recursive Mn Csl St','Recursive Mn Lnr St','Recursive',sans-serif" font-size="18" fill="#b45309" font-weight="bold">EXAMPLE  ·  Run Dart program</text><line x1="88" y1="674" x2="604" y2="674" stroke="#e2e5f0" stroke-width="2"/><text x="92" y="702" font-family="'Courier Prime Code','Special Elite',monospace" font-size="13.5" fill="#1f2937">1  RetroToolbar ▶ Run → IDE sends the active TabFile</text><text x="92" y="727" font-family="'Courier Prime Code','Special Elite',monospace" font-size="13.5" fill="#1f2937">2  DartRunnerService → Process.start(`dart run f.dart`)</text><text x="92" y="752" font-family="'Courier Prime Code','Special Elite',monospace" font-size="13.5" fill="#1f2937">3  stdout / stderr stream into ConsolePanel</text><text x="92" y="777" font-family="'Courier Prime Code','Special Elite',monospace" font-size="13.5" fill="#1f2937">4  LanguageRunner._listenToProcess → _exitCode → notifyListeners()</text><text x="92" y="802" font-family="'Courier Prime Code','Special Elite',monospace" font-size="13.5" fill="#1f2937">5  asm: Arm64AsmParser line → offset → lldb breakpoint</text><rect x="640" y="620" width="400" height="240" rx="16" fill="#ffffff" stroke="#d9dceb" stroke-width="2"/><text x="668" y="662" font-family="'Recursive Mn Csl St','Recursive Mn Lnr St','Recursive',sans-serif" font-size="18" fill="#059669" font-weight="bold">EXAMPLE  ·  Autocomplete</text><line x1="668" y1="674" x2="1012" y2="674" stroke="#e2e5f0" stroke-width="2"/><text x="672" y="702" font-family="'Courier Prime Code','Special Elite',monospace" font-size="12.5" fill="#1f2937">1  type `pri` in a Dart file</text><text x="672" y="727" font-family="'Courier Prime Code','Special Elite',monospace" font-size="12.5" fill="#1f2937">2  LspService → textDocument/completion</text><text x="672" y="752" font-family="'Courier Prime Code','Special Elite',monospace" font-size="12.5" fill="#1f2937">3  filter: tiers + MRU + kind badge</text><text x="672" y="777" font-family="'Courier Prime Code','Special Elite',monospace" font-size="12.5" fill="#1f2937">4  Tab → snippet_expander → () + caret</text><text x="672" y="802" font-family="'Courier Prime Code','Special Elite',monospace" font-size="12.5" fill="#1f2937">5  completion_docs after 2 s idle</text><rect x="1060" y="620" width="400" height="240" rx="16" fill="#ffffff" stroke="#d9dceb" stroke-width="2"/><text x="1088" y="662" font-family="'Recursive Mn Csl St','Recursive Mn Lnr St','Recursive',sans-serif" font-size="18" fill="#7c3aed" font-weight="bold">EXAMPLE  ·  Git commit</text><line x1="1088" y1="674" x2="1432" y2="674" stroke="#e2e5f0" stroke-width="2"/><text x="1092" y="702" font-family="'Courier Prime Code','Special Elite',monospace" font-size="12.5" fill="#1f2937">1  SourceControlPanel lists branch · changes</text><text x="1092" y="727" font-family="'Courier Prime Code','Special Elite',monospace" font-size="12.5" fill="#1f2937">2  GitController.stage → git add (paths)</text><text x="1092" y="752" font-family="'Courier Prime Code','Special Elite',monospace" font-size="12.5" fill="#1f2937">3  commit → GitService → GitResult</text><text x="1092" y="777" font-family="'Courier Prime Code','Special Elite',monospace" font-size="12.5" fill="#1f2937">4  push / pull → remote · behind/ahead</text><text x="1092" y="802" font-family="'Courier Prime Code','Special Elite',monospace" font-size="12.5" fill="#1f2937">5  notifyListeners → panel refreshes</text><text x="1140" y="878" text-anchor="end" font-family="'Courier Prime Code','Special Elite',monospace" font-size="11.5" fill="#94a3b8">transports: JsonRpcClient · VmServiceClient · Process pipe · Finder-safe PATH</text><rect x="60" y="916" width="1400" height="58" rx="14" fill="#ffffff" stroke="#d9dceb" stroke-width="2"/><text x="84" y="950.0" font-family="'Courier Prime Code','Special Elite',monospace" font-size="14" fil